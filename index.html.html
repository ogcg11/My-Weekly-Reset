<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Reset">
<meta name="theme-color" content="#f7f4ef">
<title>My Weekly Reset</title>
<style>
:root{--bg:#f7f4ef;--card:#fffdf9;--ink:#292724;--muted:#746f68;--line:#ded8cf;--accent:#6f5b7b;--accent2:#eee8f1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}
main{max-width:680px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
h1{font-size:29px;line-height:1.1;margin:6px 0 7px}.sub{color:var(--muted);font-size:15px;margin-bottom:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 3px;font-weight:700;font-size:13px;color:var(--ink);min-height:45px}.day.active{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:22px;font-weight:800}.focus{font-size:14px;color:var(--muted);margin-top:4px}.pill{font-size:12px;font-weight:700;background:var(--accent2);padding:7px 9px;border-radius:999px;white-space:nowrap}
.task{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);font-size:15px}.task:first-child{border-top:0;margin-top:10px}.task input{width:22px;height:22px;accent-color:var(--accent);flex:none}.task.done span{text-decoration:line-through;color:var(--muted)}
.rule{font-size:14px;line-height:1.45;color:var(--muted)}.rule strong{color:var(--ink)}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;color:var(--ink)}@media(max-width:390px){.days{gap:4px}.day{font-size:12px;padding:9px 1px}.pill{font-size:11px}}
</style>
</head>
<body>
<main>
<div class="kicker">MY WEEKLY RESET</div>
<h1>Less overwhelm. More me.</h1>
<div class="sub">Consistency—not doing everything.</div>

<div class="days" id="days"></div>
<section class="card">
  <div class="top">
    <div><div class="name" id="name"></div><div class="focus" id="focus"></div></div>
    <div class="pill" id="movement"></div>
  </div>
  <div id="tasks"></div>
  <div class="actions"><button id="clear">Clear this day</button><button id="resetWeek">Reset week</button></div>
</section>

<section class="card rule">
<strong>Your daily rule:</strong><br>
Come home → recover/nap → move → dinner → 10-minute reset.<br><br>
<strong>No household chores before you've taken care of yourself.</strong>
</section>

<script>
const data=[
 {short:"Mon",name:"Monday",focus:"Ease into the week.",move:"30–45 min walk",tasks:["Move your body","10-minute household reset","Protect your evening"]},
 {short:"Tue",name:"Tuesday",focus:"Strength + simple home care.",move:"30–45 min weights / walk",tasks:["Move your body","10-minute household reset","No extra cleaning"]},
 {short:"Wed",name:"Wednesday",focus:"Keep it light.",move:"30–45 min walk",tasks:["Move your body","10-minute household reset","Protect your evening"]},
 {short:"Thu",name:"Thursday",focus:"Strength + simple home care.",move:"30–45 min weights / walk",tasks:["Move your body","10-minute household reset","No extra cleaning"]},
 {short:"Fri",name:"Friday",focus:"You made it. Keep the evening yours.",move:"Whatever feels good",tasks:["Optional movement","Basics only","NO chores beyond basics"]},
 {short:"Sat",name:"Saturday",focus:"Movement + optional shared reset.",move:"30–60 min movement",tasks:["Move your body","Optional 30-minute shared house reset","Then stop"]},
 {short:"Sun",name:"Sunday",focus:"Reset without turning it into a workday.",move:"Easy walk / stretch",tasks:["Your laundry","30–45 min grocery / food prep","Easy movement","Then DONE"]}
];
const key="my-reset-"+new Date().getFullYear()+"-w"+getWeek();
let selected=(new Date().getDay()+6)%7;
const days=document.getElementById("days");
data.forEach((d,i)=>{const b=document.createElement("button");b.className="day";b.textContent=d.short;b.onclick=()=>select(i);days.appendChild(b)});
function getWeek(){const d=new Date(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/86400000)+1)/7)}
function getState(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function select(i){selected=i;[...days.children].forEach((b,j)=>b.classList.toggle("active",j===i));const d=data[i];name.textContent=d.name;focus.textContent=d.focus;movement.textContent=d.move;tasks.innerHTML="";const state=getState();const done=state[i]||[];d.tasks.forEach((t,j)=>{const label=document.createElement("label");label.className="task"+(done[j]?" done":"");const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!done[j];cb.onchange=()=>{const s=getState();s[i]=s[i]||[];s[i][j]=cb.checked;saveState(s);label.classList.toggle("done",cb.checked)};const span=document.createElement("span");span.textContent=t;label.append(cb,span);tasks.appendChild(label)})}
document.getElementById("clear").onclick=()=>{const s=getState();delete s[selected];saveState(s);select(selected)}
document.getElementById("resetWeek").onclick=()=>{if(confirm("Reset all checkmarks for this week?")){localStorage.removeItem(key);select(selected)}}
select(selected);
</script>
</main>
</body>
</html>
